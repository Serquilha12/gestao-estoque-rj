<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Accent Circle Outline -->
  <circle cx="256" cy="256" r="190" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.4" fill="none" />

  <!-- Inner Badge Circle -->
  <circle cx="256" cy="256" r="160" fill="#020617" opacity="0.6" />

  <!-- Shopping / POS Bag & Utensils Icon -->
  <path d="M190 200 C 190 140, 322 140, 322 200" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  
  <rect x="160" y="200" width="192" height="180" rx="24" fill="url(#accentGrad)" />

  <!-- Monogram "TK" -->
  <text x="256" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="84" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">TK</text>

  <!-- Star / Dot Accent -->
  <circle cx="256" cy="425" r="10" fill="#10B981" />
</svg>
